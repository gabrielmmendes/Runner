server.port=8080

# Graceful shutdown: termina requisicoes em curso antes de finalizar
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Auto-stop por inatividade (minutos; 0 desativa)
assinador.idle-timeout-min=0

# PKCS#11 (vazio = modo simulado em memoria)
assinador.pkcs11.library=
