name: E2E

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Build assinador.jar
        working-directory: projetos/assinador-java
        run: mvn -B -q package -DskipTests

      - name: Locate jar
        id: jar
        working-directory: projetos/assinador-java
        run: echo "path=$(ls target/assinador-*.jar | head -n1)" >> "$GITHUB_OUTPUT"

      - name: E2E — CLI → HTTP → assinador.jar (sign, validate, metrics)
        working-directory: projetos/assinador-cli
        env:
          ASSINATURA_JAR: ${{ github.workspace }}/projetos/assinador-java/${{ steps.jar.outputs.path }}
        run: go test -tags=integration -v ./internal/sign/...

      - name: E2E — server lifecycle smoke (start/status/stop)
        working-directory: projetos/assinador-cli
        env:
          ASSINATURA_JAR: ${{ github.workspace }}/projetos/assinador-java/${{ steps.jar.outputs.path }}
        run: |
          go build -o assinatura .
          ./assinatura server start --port 18080
          ./assinatura server status | tee status.txt
          grep -q "UP" status.txt
          curl -fsS http://localhost:18080/metrics | grep -q assinador_uptime_seconds
          ./assinatura server stop --port 18080
