name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # criar release + anexar artefatos
  id-token: write   # OIDC para assinatura keyless Cosign

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build binaries (linux/windows/darwin amd64)
        working-directory: projetos/assinador-cli
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          for OS in linux windows darwin; do
            EXT=""
            if [ "$OS" = "windows" ]; then EXT=".exe"; fi
            GOOS=$OS GOARCH=amd64 \
            go build -ldflags="-X github.com/gabrielmmendes/runner/internal/version.Version=$VERSION" \
            -o dist/assinatura-$VERSION-$OS-amd64${EXT}
          done

      - name: Generate SHA256SUMS
        working-directory: projetos/assinador-cli/dist
        run: sha256sum * > SHA256SUMS

      - name: Sign artifacts with Cosign (keyless)
        working-directory: projetos/assinador-cli/dist
        env:
          COSIGN_YES: "true"
        run: |
          for f in $(find . -maxdepth 1 -type f ! -name '*.sig' ! -name '*.pem'); do
            cosign sign-blob \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: projetos/assinador-cli/dist/*
