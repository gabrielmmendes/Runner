name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Build
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}

          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          go build -ldflags="-X github.com/gabrielmmendes/runner/internal/version.Version=$VERSION" \
          -o dist/runner-$VERSION-${{ matrix.os }}-${{ matrix.arch }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
